<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4372b"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a6d"/></marker>
</defs><text x="450" y="32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="middle">Building the automaton once and using it for every URL</text><rect x="30" y="70" width="840" height="130" rx="12" fill="#e6f1fb" stroke="#0b4f8a" stroke-width="2" stroke-dasharray="7 5" opacity="1"/><rect x="46" y="55" width="401.2" height="30" rx="6" fill="#0b4f8a" stroke="#0b4f8a" stroke-width="1.5" opacity="1"/><text x="59" y="76" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">BUILT ONCE AT START-UP (about 70 ms)</text><rect x="50" y="110" width="142" height="70" rx="8" fill="#fff" stroke="#0b4f8a" stroke-width="1.8" opacity="1"/><text x="121" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#1f2933" text-anchor="middle">URL grammar</text><text x="121" y="164" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">regular expression</text><rect x="222" y="110" width="142" height="70" rx="8" fill="#fff" stroke="#0b4f8a" stroke-width="1.8" opacity="1"/><text x="293" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#1f2933" text-anchor="middle">NFA</text><text x="293" y="164" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">618 states</text><rect x="394" y="110" width="142" height="70" rx="8" fill="#fff" stroke="#0b4f8a" stroke-width="1.8" opacity="1"/><text x="465" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#1f2933" text-anchor="middle">DFA</text><text x="465" y="164" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">299 states</text><rect x="566" y="110" width="142" height="70" rx="8" fill="#fff" stroke="#0b4f8a" stroke-width="1.8" opacity="1"/><text x="637" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#1f2933" text-anchor="middle">Minimal DFA</text><text x="637" y="164" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">258 states</text><rect x="738" y="110" width="142" height="70" rx="8" fill="#fff" stroke="#0b4f8a" stroke-width="1.8" opacity="1"/><text x="809" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#1f2933" text-anchor="middle">Tables</text><text x="809" y="164" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">258 × 29 cells</text><path d="M192,145 L222,145" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M364,145 L394,145" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M536,145 L566,145" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M708,145 L738,145" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="30" y="240" width="840" height="250" rx="12" fill="#e5f4f1" stroke="#14564c" stroke-width="2" stroke-dasharray="7 5" opacity="1"/><rect x="46" y="225" width="166.6" height="30" rx="6" fill="#14564c" stroke="#14564c" stroke-width="1.5" opacity="1"/><text x="59" y="246" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">FOR EVERY URL</text><rect x="60" y="280" width="160" height="70" rx="8" fill="#fff" stroke="#14564c" stroke-width="1.8" opacity="1"/><text x="140" y="310" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#1f2933" text-anchor="middle">Input string</text><text x="140" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">http://exa mple.com</text><rect x="290" y="280" width="190" height="70" rx="8" fill="#fff" stroke="#14564c" stroke-width="1.8" opacity="1"/><text x="385" y="308" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Read one character</text><text x="385" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">q = delta[q][class(c)]</text><path d="M220,315 L290,315" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="550" y="280" width="150" height="70" rx="8" fill="#fbf3df" stroke="#5a4314" stroke-width="1.8" opacity="1"/><text x="625" y="308" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Dead state?</text><text x="625" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">q cannot reach accept</text><path d="M480,315 L550,315" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="740" y="270" width="110" height="50" rx="8" fill="#fbe9e6" stroke="#7d261c" stroke-width="1.8" opacity="1"/><text x="795" y="291" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#7d261c" text-anchor="middle">INVALID</text><text x="795" y="310" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">at position i</text><path d="M700,300 L740,295" fill="none" stroke="#7d261c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrR)"/><text x="716" y="288" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#7d261c" text-anchor="middle">yes</text><path d="M625,350 L625,390 L385,390 L385,350" fill="none" stroke="#14564c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arrG)"/><text x="505" y="383" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#14564c" text-anchor="middle">no: next character</text><rect x="60" y="420" width="250" height="50" rx="8" fill="#fff" stroke="#14564c" stroke-width="1.8" opacity="1"/><text x="185" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">End of input reached</text><path d="M140,350 L140,420" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3 3" marker-end="url(#arr)"/><rect x="360" y="420" width="230" height="50" rx="8" fill="#e5f4f1" stroke="#14564c" stroke-width="1.8" opacity="1"/><text x="475" y="442" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#14564c" text-anchor="middle">accepting state: VALID</text><text x="475" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">then split the parts</text><rect x="620" y="420" width="230" height="50" rx="8" fill="#fbf3df" stroke="#5a4314" stroke-width="1.8" opacity="1"/><text x="735" y="442" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5a4314" text-anchor="middle">other state: INCOMPLETE</text><text x="735" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">give the expected characters</text><path d="M310,445 L360,445" fill="none" stroke="#14564c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrG)"/><path d="M590,445 L620,445" fill="none" stroke="#5a4314" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/></svg>