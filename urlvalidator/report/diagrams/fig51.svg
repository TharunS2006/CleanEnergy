<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4372b"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a6d"/></marker>
</defs><text x="450" y="30" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700" fill="#1f2933" text-anchor="middle">The URL language as a chain of phases (each box is a block of automaton states)</text><rect x="24" y="80" width="128" height="56" rx="28" fill="#eceefa" stroke="#33366b" stroke-width="2" opacity="1"/><text x="88.0" y="106" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">scheme</text><text x="88.0" y="125" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">http(s) / ftp(s)</text><rect x="188" y="80" width="100" height="56" rx="28" fill="#eceefa" stroke="#33366b" stroke-width="2" opacity="1"/><text x="238.0" y="106" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">://</text><text x="238.0" y="125" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">two slashes</text><rect x="330" y="80" width="190" height="56" rx="28" fill="#e6f1fb" stroke="#0b4f8a" stroke-width="2" opacity="1"/><rect x="335" y="85" width="180" height="46" rx="23" fill="none" stroke="#0b4f8a" stroke-width="1.4" opacity="1"/><text x="425.0" y="106" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">host</text><text x="425.0" y="125" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">name | IPv4 | localhost</text><rect x="560" y="80" width="128" height="56" rx="28" fill="#fbf3df" stroke="#5a4314" stroke-width="2" opacity="1"/><rect x="565" y="85" width="118" height="46" rx="23" fill="none" stroke="#5a4314" stroke-width="1.4" opacity="1"/><text x="624.0" y="106" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">port</text><text x="624.0" y="125" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">: 1 – 65535</text><rect x="330" y="250" width="150" height="56" rx="28" fill="#e5f4f1" stroke="#14564c" stroke-width="2" opacity="1"/><rect x="335" y="255" width="140" height="46" rx="23" fill="none" stroke="#14564c" stroke-width="1.4" opacity="1"/><text x="405.0" y="276" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">path</text><text x="405.0" y="295" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">( / pchar* )*</text><rect x="560" y="250" width="128" height="56" rx="28" fill="#e5f4f1" stroke="#14564c" stroke-width="2" opacity="1"/><rect x="565" y="255" width="118" height="46" rx="23" fill="none" stroke="#14564c" stroke-width="1.4" opacity="1"/><text x="624.0" y="276" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">query</text><text x="624.0" y="295" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">? pchar | / | ?</text><rect x="724" y="250" width="150" height="56" rx="28" fill="#e5f4f1" stroke="#14564c" stroke-width="2" opacity="1"/><rect x="729" y="255" width="140" height="46" rx="23" fill="none" stroke="#14564c" stroke-width="1.4" opacity="1"/><text x="799.0" y="276" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">fragment</text><text x="799.0" y="295" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle"># pchar | / | ?</text><path d="M0,108 L24,108" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M152,108 L188,108" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M288,108 L330,108" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M520,108 L560,108" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><text x="540" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">:</text><path d="M380,136 L380,250" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><text x="366" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="end">/</text><path d="M624,136 L624,172 L450,172 L450,250" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="540" y="166" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">/</text><path d="M500,136 L500,206 L610,206 L610,250" fill="none" stroke="#1f2933" stroke-width="2.0" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="555" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">?</text><path d="M480,278 L560,278" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><text x="520" y="270" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">?</text><path d="M688,278 L724,278" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><text x="706" y="270" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">#</text><path d="M405,306 L405,340 L790,340 L790,306" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="600" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">#  (no query)</text><rect x="24" y="372" width="852" height="172" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="40" y="408" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">How to read this</text><text x="40" y="434" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">• Double outlines are accepting phases: the URL may end there. Scheme and &#x27;://&#x27; are not accepting.</text><text x="40" y="458" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">• Anything that does not fit an arrow moves the automaton to the single dead state; the validator stops there.</text><text x="40" y="482" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">• A &#x27;?&#x27; or &#x27;#&#x27; may also follow the host or port directly (path, query and fragment are all optional).</text><text x="40" y="506" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">• The real automaton has 258 states; the host rules built on their own need 234, mostly counting label length up to 63</text><text x="40" y="530" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">   and checking the four IPv4 parts and the 5-digit port limits digit by digit.</text></svg>