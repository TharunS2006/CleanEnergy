<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4372b"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a6d"/></marker>
</defs><text x="450" y="32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="middle">From a workload to a recommendation</text><rect x="30" y="62" width="150" height="90" rx="8" fill="#fff" stroke="#5a4314" stroke-width="1.8" opacity="1"/><text x="105" y="96" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Workload</text><text x="105" y="118.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">processes, page</text><text x="105" y="133.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">references or</text><text x="105" y="149.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">disk requests</text><rect x="250" y="70" width="380" height="100" rx="10" fill="#e6f1fb" stroke="#0b4f8a" stroke-width="2" opacity="1"/><text x="266" y="96" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#0b4f8a" text-anchor="start">CPU: run every algorithm</text><text x="266" y="122" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">FCFS · SJF · SRTF · PRIORITY · PRIORITY-P · RR</text><text x="266" y="148" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="start">measures: waiting, turnaround, response, switches</text><path d="M180,107 L215,107 L215,120 L250,120" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="250" y="210" width="380" height="100" rx="10" fill="#e5f4f1" stroke="#14564c" stroke-width="2" opacity="1"/><text x="266" y="236" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#14564c" text-anchor="start">MEMORY: run every algorithm</text><text x="266" y="262" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">FIFO · LRU · OPT · CLOCK</text><text x="266" y="288" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="start">measures: page faults, hits, fault rate</text><path d="M215,260 L250,260" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="250" y="350" width="380" height="100" rx="10" fill="#eceefa" stroke="#33366b" stroke-width="2" opacity="1"/><text x="266" y="376" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#33366b" text-anchor="start">I/O: run every algorithm</text><text x="266" y="402" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">FCFS · SSTF · SCAN · C-SCAN · LOOK · C-LOOK</text><text x="266" y="428" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="start">measures: total head movement</text><path d="M215,400 L250,400" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M215,107 L215,400" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/><rect x="690" y="150" width="180" height="220" rx="10" fill="#fbf3df" stroke="#5a4314" stroke-width="2" opacity="1"/><text x="780" y="182" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">Optimizer</text><text x="780" y="210" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle">1. rank by the metric</text><text x="780" y="231" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle">2. pick the best</text><text x="780" y="252" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle">3. compare with</text><text x="780" y="273" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle">    the baseline</text><text x="780" y="294" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle">4. explain the choice</text><path d="M630,120 L660,120 L660,260 L690,260" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/><path d="M630,260 L690,260" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M630,400 L660,400 L660,260 L690,260" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/><rect x="250" y="484" width="620" height="60" rx="10" fill="#e5f4f1" stroke="#14564c" stroke-width="2" opacity="1"/><text x="560" y="510" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#14564c" text-anchor="middle">Recommendation: best algorithm per resource, with the percentage saved</text><text x="560" y="531" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">against FCFS (CPU), FIFO (memory) and FCFS (disk), and the reason it wins</text><path d="M780,370 L780,484" fill="none" stroke="#14564c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrG)"/></svg>