ll="#e6f1fb" stroke="#0b4f8a" stroke-width="2" opacity="1"/><text x="745.0" y="71" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="middle">attempts</text><text x="630" y="102" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#0b4f8a" text-anchor="start">*id (PK)</text><text x="630" y="123" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">quiz_id (FK), user_id (FK)</text><text x="630" y="144" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">started_at, deadline</text><text x="630" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">submitted_at, status</text><text x="630" y="186" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">score, total, late</text><text x="630" y="207" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">calibration</text><rect x="620" y="270" width="250" height="130" rx="8" fill="#fff" stroke="#0b4f8a" stroke-width="2" opacity="1"/><rect x="620" y="270" width="250" height="30" rx="8" fill="#e6f1fb" stroke="#0b4f8a" stroke-width="2" opacity="1"/><text x="745.0" y="291" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="middle">answers</text><text x="630" y="322" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">attempt_id (FK)</text><text x="630" y="343" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">question_id</text><text x="630" y="364" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">chosen, correct</text><text x="630" y="385" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">confidence: 1 | 2 | 3</text><rect x="620" y="420" width="250" height="130" rx="8" fill="#fff" stroke="#5a4314" stroke-width="2" opacity="1"/><rect x="620" y="420" width="250" height="30" rx="8" fill="#fbf3df" stroke="#5a4314" stroke-width="2" opacity="1"/><text x="745.0" y="441" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="middle">practice_log</text><text x="630" y="472" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#5a4314" text-anchor="start">*id (PK)</text><text x="630" y="493" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">user_id (FK), question_id (FK)</text><text x="630" y="514" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">chosen, correct, confidence</text><text x="630" y="535" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">at</text><rect x="620" y="570" width="250" height="109" rx="8" fill="#fff" stroke="#5a4314" stroke-width="2" opacity="1"/><rect x="620" y="570" width="250" height="30" rx="8" fill="#fbf3df" stroke="#5a4314" stroke-width="2" opacity="1"/><text x="745.0" y="591" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="middle">revision</text><text x="630" y="622" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#5a4314" text-anchor="start">*user_id, *question_id (PK)</text><text x="630" y="643" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">box: 1 to 5</text><text x="630" y="664" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">due (date)</text><path d="M145,190 L145,230" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M435,242 L435,290" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M435,354 L435,410" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M560,470 L592,470 L592,130 L620,130" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M745,198 L745,270" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="30" y="560" width="560" height="120" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="44" y="586" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Also related (not drawn): users - attempts, users - practice_log, users - revision,</text><text x="44" y="608" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">questions - answers, questions - practice_log, questions - revision.</text><text x="44" y="630" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">PK primary key, FK foreign key. Deleting a user, a quiz or an attempt removes the</text><text x="44" y="652" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">rows that depend on it (ON DELETE CASCADE). A question used in a quiz cannot be deleted.</text></svg>