<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><rect width="900" height="620" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4372b"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a6d"/></marker>
</defs><text x="450" y="28" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="middle">One quiz attempt, from start to review</text><rect x="30" y="50" width="240" height="36" rx="8" fill="#eceefa" stroke="#33366b" stroke-width="2" opacity="1"/><text x="150" y="74" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#33366b" text-anchor="middle">Student (browser)</text><path d="M150,86 L150,600" fill="none" stroke="#33366b" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="330" y="50" width="240" height="36" rx="8" fill="#e5f4f1" stroke="#14564c" stroke-width="2" opacity="1"/><text x="450" y="74" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#14564c" text-anchor="middle">API</text><path d="M450,86 L450,600" fill="none" stroke="#14564c" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="630" y="50" width="240" height="36" rx="8" fill="#fbf3df" stroke="#5a4314" stroke-width="2" opacity="1"/><text x="750" y="74" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#5a4314" text-anchor="middle">Database</text><path d="M750,86 L750,600" fill="none" stroke="#5a4314" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M150,120 L450,120" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="300.0" y="112" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">POST /quizzes/{id}/start</text><path d="M450,150 L750,150" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="600.0" y="142" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">attempts left? create the attempt</text><path d="M450,180 L150,180" fill="none" stroke="#14564c" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrG)"/><text x="300.0" y="172" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#14564c" text-anchor="middle">shuffled paper + seconds_left</text><rect x="60" y="196" width="180" height="44" rx="6" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="150" y="216" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">student answers,</text><text x="150" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">marks how sure</text><path d="M150,270 L450,270" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="300.0" y="262" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">POST /attempts/{id}/submit  (answers + confidence)</text><path d="M450,300 L750,300" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="600.0" y="292" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">read attempt, deadline, answer key</text><rect x="340" y="316" width="220" height="62" rx="6" fill="#fff" stroke="#14564c" stroke-width="1.6" opacity="1"/><text x="450" y="338" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">late = now &gt; deadline + 30 s</text><text x="450" y="356" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">score, calibration (Brier)</text><text x="450" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">misconception = certain and wrong</text><path d="M450,410 L750,410" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="600.0" y="402" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">save answers, score, status = done</text><path d="M450,440 L750,440" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="600.0" y="432" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">wrong answers: Leitner box 1, due tomorrow</text><path d="M450,480 L150,480" fill="none" stroke="#14564c" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrG)"/><text x="300.0" y="472" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#14564c" text-anchor="middle">score, calibration, review + explanations</text><rect x="30" y="520" width="840" height="70" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="46" y="546" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">Errors on the way: 409 if the attempt was already submitted or all attempts are used, 404 for an unknown attempt,</text><text x="46" y="568" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">403 if the caller is not a student, 401 without a token. A closed late attempt does not appear in the leaderboard.</text></svg>