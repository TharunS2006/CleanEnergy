<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4372b"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a6d"/></marker>
</defs><text x="450" y="30" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="middle">The deployment that is modelled</text><rect x="30" y="62" width="560" height="330" rx="12" fill="#e6f1fb" stroke="#0b4f8a" stroke-width="2" stroke-dasharray="7 5" opacity="1"/><rect x="46" y="47" width="176.79999999999998" height="30" rx="6" fill="#0b4f8a" stroke="#0b4f8a" stroke-width="1.5" opacity="1"/><text x="59" y="68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">PRIMARY REGION</text><rect x="60" y="100" width="230" height="190" rx="10" fill="#fff" stroke="#33366b" stroke-width="1.8" opacity="1"/><text x="76" y="124" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#33366b" text-anchor="start">Availability zone 1</text><rect x="80" y="140" width="190" height="56" rx="8" fill="#eceefa" stroke="#33366b" stroke-width="1.6" opacity="1"/><text x="175" y="164" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">VM A (active)</text><text x="175" y="184" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">on host A</text><rect x="80" y="210" width="190" height="56" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="175" y="234" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">spare host</text><text x="175" y="254" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">for auto-restart</text><rect x="330" y="100" width="230" height="190" rx="10" fill="#fff" stroke="#33366b" stroke-width="1.8" opacity="1"/><text x="346" y="124" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#33366b" text-anchor="start">Availability zone 2</text><rect x="350" y="140" width="190" height="56" rx="8" fill="#eceefa" stroke="#33366b" stroke-width="1.6" opacity="1"/><text x="445" y="164" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">VM B (active or standby)</text><text x="445" y="184" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">on host B</text><rect x="150" y="316" width="300" height="52" rx="8" fill="#fbf3df" stroke="#5a4314" stroke-width="1.8" opacity="1"/><text x="300" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Load balancer / failover manager</text><text x="300" y="358" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">health checks, switches traffic</text><path d="M175,316 L175,290" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M445,316 L445,290" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M290,168 L350,168" fill="none" stroke="#14564c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrG)" marker-start="url(#arrG)"/><text x="320" y="160" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#14564c" text-anchor="middle">sync</text><rect x="630" y="62" width="240" height="330" rx="12" fill="#e5f4f1" stroke="#14564c" stroke-width="2" stroke-dasharray="7 5" opacity="1"/><rect x="646" y="47" width="125.8" height="30" rx="6" fill="#14564c" stroke="#14564c" stroke-width="1.5" opacity="1"/><text x="659" y="68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">DR REGION</text><rect x="650" y="110" width="200" height="70" rx="8" fill="#fff" stroke="#14564c" stroke-width="1.8" opacity="1"/><text x="750" y="136" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Standby copy</text><text x="750" y="156" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">cold, pilot light,</text><text x="750" y="171" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">warm or active</text><rect x="650" y="210" width="200" height="70" rx="8" fill="#fff" stroke="#14564c" stroke-width="1.8" opacity="1"/><text x="750" y="236" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Backup vault</text><text x="750" y="256" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">copies of the disks</text><path d="M590,145 L650,145" fill="none" stroke="#14564c" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arrG)"/><text x="610" y="136" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#14564c" text-anchor="middle">async</text><path d="M590,245 L650,245" fill="none" stroke="#5a4314" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="610" y="266" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5a4314" text-anchor="middle">backup</text><rect x="30" y="420" width="840" height="124" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="48" y="448" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">What can fail, and what each design survives</text><text x="48" y="474" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">• a host (hours): auto-restart, a standby VM or a second active VM keeps the service going</text><text x="48" y="496" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">• a whole zone (rare): needs the second VM in another zone</text><text x="48" y="518" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">• a whole region (very rare): needs the DR region; its recovery time (RTO) and the data lost (RPO) depend on the tier</text></svg>