ll="#52606d" text-anchor="middle">service down</text><path d="M155,160 L155,300" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="143" y="235" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="end">λ standby fails</text><path d="M185,300 L185,160" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="197" y="235" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="start">μ repaired</text><path d="M250,118 L560,118" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="405" y="108" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">λ active fails</text><path d="M560,142 L250,142" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="405" y="164" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">μ original repaired: switch abandoned</text><path d="M560,150 L250,318" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="470" y="244" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">φ switch done</text><path d="M250,345 L560,345" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="405" y="336" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">λ active fails</text><path d="M560,365 L250,365" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="405" y="388" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">μ original repaired</text><path d="M655,160 L655,300" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="667" y="235" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="start">λ target fails</text><path d="M700,300 L700,160" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="712" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="start">μ standby back</text><rect x="60" y="410" width="780" height="56" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="76" y="434" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">λ = 1 / MTBF   μ = 1 / MTTR   φ = 1 / failover time.   Unavailability = probability of state 2 + probability of state 3.</text><text x="76" y="455" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">The simulator is checked against this model (Table 6.2).</text></svg>