name: CloudPulse CI
on:
  push:
    paths: ["cloudpulse/**", ".github/workflows/cloudpulse-ci.yml"]
  pull_request:
    paths: ["cloudpulse/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudpulse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloudpulse/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
