<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980"><rect width="760" height="980" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs><path d="M129.5,14.1 L630.4,13.9 L630.1,68.7 L128.9,69.0 Z" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="47.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Scheduler (6 h) or Sync button</text><path d="M380.0,69.0 L380.0,101.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M128.8,100.8 L628.9,99.9 L629.8,155.8 L129.0,154.3 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="133.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Sign in to Azure: obtain access token</text><path d="M380.0,155.0 L380.0,187.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M130.3,188.2 L630.2,186.7 L631.2,239.8 L130.9,240.5 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="219.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Read bill: Cost Management query (daily cost)</text><path d="M380.0,241.0 L380.0,273.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M129.1,272.0 L629.5,273.8 L629.2,327.2 L130.4,326.7 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="305.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Read inventory: Resource Graph (disks, IPs, snapshots, VMs)</text><path d="M380.0,327.0 L380.0,359.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M130.1,357.9 L628.9,358.2 L630.5,412.8 L129.5,413.2 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="391.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Read usage and advice: VM metrics, Azure Advisor</text><path d="M380.0,413.0 L380.0,445.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M129.9,444.5 L630.8,445.5 L629.3,499.2 L130.1,500.0 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="477.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Find owners: Activity Log, then tags; price with Retail Prices</text><path d="M380.0,499.0 L380.0,531.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M130.6,530.4 L631.2,530.0 L629.8,585.7 L129.1,585.0 Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="563.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Detect waste: rules and VM verdict</text><path d="M380.0,585.0 L380.0,617.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M128.8,617.4 L630.7,617.2 L631.0,670.5 L130.5,671.2 Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="649.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Score, de-duplicate, upsert findings</text><path d="M380.0,671.0 L380.0,703.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M130.2,702.9 L630.9,704.2 L629.9,757.4 L128.9,757.5 Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="735.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Anomalies, budget forecast, untagged spend</text><path d="M380.0,757.0 L380.0,789.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><path d="M130.4,790.3 L630.8,788.4 L629.7,843.4 L128.8,842.9 Z" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8" stroke-linejoin="round"/><text x="380.0" y="821.25" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#111">Verify fixes, notify, write audit log</text><text x="380" y="867.0" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" text-anchor="middle" fill="#555">Each step stores its own error, so one failing source does not stop the others.</text></svg>