nt-size="18.5" font-weight="700" fill="#1f2933" text-anchor="start">5  Attribute owners and prices</text><text x="122" y="564" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.2" font-weight="400" fill="#52606d" text-anchor="start">creator from the Activity Log, then tags; list price fallback</text><text x="650" y="554" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#0b4f8a" text-anchor="start" font-style="italic">Insights/eventtypes · prices.azure.com</text><path d="M340,584 L340,608" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="60" y="608" width="560" height="74" rx="10" fill="#fff" stroke="#14564c" stroke-width="2" opacity="1"/><rect x="60" y="608" width="8" height="74" rx="3" fill="#14564c" stroke="#14564c" stroke-width="1" opacity="1"/><g fill="none" stroke="#14564c" stroke-width="2.4"><circle cx="94" cy="645.0" r="5"/><circle cx="94" cy="645.0" r="11" stroke-dasharray="4 3.2"/></g><text x="122" y="638" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700" fill="#1f2933" text-anchor="start">6  Detect</text><text x="122" y="662" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.2" font-weight="400" fill="#52606d" text-anchor="start">idle / oversized VMs, unattached disks, idle IPs, orphan snapshots</text><text x="650" y="652" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#14564c" text-anchor="start" font-style="italic">rules + analytics.vm_verdict()</text><path d="M340,682 L340,706" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="60" y="706" width="560" height="74" rx="10" fill="#fff" stroke="#14564c" stroke-width="2" opacity="1"/><rect x="60" y="706" width="8" height="74" rx="3" fill="#14564c" stroke="#14564c" stroke-width="1" opacity="1"/><path d="M9