<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4372b"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a6d"/></marker>
</defs><rect x="20" y="70" width="190" height="70" rx="12" fill="#eef0f2" stroke="#3e4850" stroke-width="2" opacity="1"/><text x="115.0" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#3e4850" text-anchor="middle">open</text><text x="115.0" y="124" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="middle">detected, no owner yet</text><rect x="240" y="70" width="190" height="70" rx="12" fill="#eceefa" stroke="#33366b" stroke-width="2" opacity="1"/><text x="335.0" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#33366b" text-anchor="middle">assigned</text><text x="335.0" y="124" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="middle">owner chosen</text><rect x="460" y="70" width="190" height="70" rx="12" fill="#fbf3df" stroke="#5a4314" stroke-width="2" opacity="1"/><text x="555.0" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#5a4314" text-anchor="middle">in progress</text><text x="555.0" y="124" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="middle">being fixed</text><rect x="680" y="70" width="190" height="70" rx="12" fill="#e6f1fb" stroke="#0b4f8a" stroke-width="2" opacity="1"/><text x="775.0" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b4f8a" text-anchor="middle">resolved</text><text x="775.0" y="124" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="middle">marked fixed</text><rect x="680" y="290" width="190" height="70" rx="12" fill="#e5f4f1" stroke="#14564c" stroke-width="2" opacity="1"/><text x="775.0" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#14564c" text-anchor="middle">verified</text><text x="775.0" y="344" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="middle">bill dropped: saving counted</text><rect x="20" y="450" width="190" height="70" rx="12" fill="#fbe9e6" stroke="#7d261c" stroke-width="2" opacity="1"/><text x="115.0" y="480" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7d261c" text-anchor="middle">dismissed</text><text x="115.0" y="504" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="middle">reason required</text><rect x="240" y="450" width="190" height="70" rx="12" fill="#eef0f2" stroke="#3e4850" stroke-width="2" opacity="1"/><text x="335.0" y="480" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#3e4850" text-anchor="middle">snoozed</text><text x="335.0" y="504" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="middle">1 – 90 days</text><path d="M210,105 L240,105" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M430,105 L460,105" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M650,105 L680,105" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr)"/><text x="225" y="60" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">assign</text><text x="445" y="60" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">start</text><text x="665" y="60" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">resolve</text><path d="M775,140 L775,290" fill="none" stroke="#14564c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrG)"/><text x="763" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#14564c" text-anchor="end">7-day before / after</text><text x="763" y="219" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#14564c" text-anchor="end">bill comparison</text><text x="763" y="238" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="end">(≥ 3 days after the fix)</text><path d="M775,70 L775,28 L335,28 L335,70" fill="none" stroke="#a4372b" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arrR)"/><text x="555" y="20" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#7d261c" text-anchor="middle">still detected after the fix  →  reopened</text><path d="M115,140 L115,450" fill="none" stroke="#a4372b" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arrR)"/><path d="M335,140 L335,450" fill="none" stroke="#3e4850" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arr)"/><path d="M555,140 L555,190 L335,190" fill="none" stroke="#3e4850" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4"/><path d="M115,190 L115,190" fill="none" stroke="#a4372b" stroke-width="2" stroke-linejoin="round"/><text x="127" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#7d261c" text-anchor="start">dismiss</text><text x="347" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#3e4850" text-anchor="start">snooze</text><text x="130" y="168" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start" font-style="italic">from any active state</text><rect x="440" y="420" width="440" height="164" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="456" y="446" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Automatic transitions</text><text x="456" y="472" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">• snooze expires  →  back to open</text><text x="456" y="494" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">• no longer detected  →  resolved automatically</text><text x="456" y="516" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">• verified resource returns  →  reopened,</text><text x="456" y="538" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">   its saving is withdrawn</text><text x="456" y="560" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">• dismissed finding detected again  →  reopened</text><text x="20" y="556" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start" font-style="italic">Owners and admins may take every action;</text><text x="20" y="574" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start" font-style="italic">the assignee may start and resolve.</text></svg>