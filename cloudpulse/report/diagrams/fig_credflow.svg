Resource</text><text x="720" y="68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#dbe7f3" text-anchor="middle">Manager + RBAC</text><path d="M720,82 L720,1135" fill="none" stroke="#9aa5b1" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="10" y="100" width="880" height="330" rx="10" fill="#f4f5f6" stroke="#3e4850" stroke-width="1.3" stroke-dasharray="6 4" opacity="1"/><rect x="10" y="100" width="4" height="330" rx="2" fill="#3e4850" stroke="#3e4850" stroke-width="1" opacity="1"/><text x="26" y="124" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#3e4850" text-anchor="start">A.  One-time setup  (Azure Cloud Shell, scripts/azure/03-reader-identity.sh)</text><path d="M90,168 L520,168" fill="none" stroke="#3e4850" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="3 5" marker-end="url(#arr)"/><text x="120" y="142" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#3e4850" text-anchor="start">az ad sp create-for-rbac</text><text x="120" y="159" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">creates app registration + service principal</text><circle cx="106" cy="168" r="11" fill="#3e4850"/><text x="106" y="174" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><path d="M520,218 L90,218" fill="none" stroke="#3e4850" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="3 5" marker-end="url(#arr)"/><text x="120" y="192" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#3e4850" text-anchor="start">appId + client secret + tenant</text><text x="120" y="209" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">secret shown once; 1-year expiry</text><circle cx="106" cy="218" r="11" fill="#3e4850"/><text x="106" y="224" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><path d="M90,280 L720,280" fill="none" stroke="#3e4850" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="3 5" marker-end="url(#arr)"/><text x="120" y="254" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#3e4850" text-anchor="start">az role assignment create</text><text x="120" y="271" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">Reader + Cost Management Reader @ /subscriptions/{id}</text><circle cx="106" cy="280" r="11" fill="#3e4850"/><text x="106" y="286" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M90,350 L300,350" fill="none" stroke="#a4372b" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="120" y="324" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a4372b" text-anchor="start">paste 4 values: Connect Azure</text><text x="120" y="341" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">subscription · tenant · client ID · secret</text><circle cx="106" cy="350" r="11" fill="#a4372b"/><text x="106" y="356" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="200.0" y="372" width="200" height="48" rx="6" fill="#fff" stroke="#a4372b" stroke-width="1.4" opacity="1"/><text x="300" y="392" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">secret → Fernet token</text><text x="300" y="409" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">stored in connections</text><rect x="10" y="450" width="880" height="215" rx="10" fill="#e6f1fb" stroke="#0b4f8a" stroke-width="1.3" stroke-dasharray="6 4" opacity="1"/><rect x="10" y="450" width="4" height="215" rx="2" fill="#0b4f8a" stroke="#0b4f8a" stroke-width="1" opacity="1"/><text x="26" y="474" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0b4f8a" text-anchor="start">B.  Runtime sign-in  (every sync, ClientSecretCredential)</text><path d="M300,520 L520,520" fill="none" stroke="#0b4f8a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="330" y="494" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0b4f8a" text-anchor="start">POST /{tenant}/oauth2/v2.0/token</text><text x="330" y="511" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">client_id · client_secret · scope management.azure.com/.default</text><circle cx="316" cy="520" r="11" fill="#0b4f8a"/><text x="316" y="526" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="420.0" y="538" width="200" height="48" rx="6" fill="#fff" stroke="#0b4f8a" stroke-width="1.4" opacity="1"/><text x="520" y="558" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">Entra ID verifies secret</text><text x="520" y="575" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">and tenant, issues JWT</text><path d="M520,624 L300,624" fill="none" stroke="#0b4f8a" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="330" y="598" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0b4f8a" text-anchor="start">access token (JWT, ≈ 1 hour)</text><text x="330" y="615" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">cached in memory; refreshed by azure-identity</text><circle cx="316" cy="624" r="11" fill="#0b4f8a"/><text x="316" y="630" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="10" y="685" width="880" height="290" rx="10" fill="#e5f4f1" stroke="#14564c" stroke-width="1.3" stroke-dasharray="6 4" opacity="1"/><rect x="10" y="685" width="4" height="290" rx="2" fill="#14564c" stroke="#14564c" stroke-width="1" opacity="1"/><text x="26" y="709" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#14564c" text-anchor="start">C.  Reading the subscription  (read-only ARM calls)</text><path d="M300,755 L720,755" fill="none" stroke="#14564c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="330" y="729" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#14564c" text-anchor="start">GET / POST management.azure.com/…</text><text x="330" y="746" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">Authorization: Bearer &lt;token&gt; · api-version</text><circle cx="316" cy="755" r="11" fill="#14564c"/><text x="316" y="761" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">7</text><rect x="615.0" y="773" width="210" height="48" rx="6" fill="#fff" stroke="#a4372b" stroke-width="1.4" opacity="1"/><text x="720" y="793" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">validate token, then check</text><text x="720" y="810" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">RBAC role at the scope</text><path d="M720,863 L300,863" fill="none" stroke="#14564c" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="330" y="837" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#14564c" text-anchor="start">200 JSON  (or 403 / 404 / 429)</text><text x="330" y="854" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">403 = missing role · 429 = wait Retry-After, retry</text><circle cx="316" cy="863" r="11" fill="#14564c"/><text x="316" y="869" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">8</text><rect x="195.0" y="885" width="210" height="65" rx="6" fill="#fff" stroke="#14564c" stroke-width="1.4" opacity="1"/><text x="300" y="905" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">page results (nextLink,</text><text x="300" y="922" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">$skipToken); store costs,</text><text x="300" y="939" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">signals → findings</text><rect x="10" y="995" width="880" height="130" rx="10" fill="#fbe9e6" stroke="#7d261c" stroke-width="1.3" stroke-dasharray="6 4" opacity="1"/><rect x="10" y="995" width="4" height="130" rx="2" fill="#7d261c" stroke="#7d261c" stroke-width="1" opacity="1"/><text x="26" y="1019" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7d261c" text-anchor="start">D.  Connection test  (shown when the admin saves the connection)</text><text x="26" y="1048" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1f2933" text-anchor="start">GET /subscriptions/{id}  →  “Connected: &lt;subscription name&gt;”, or an exact reason:</text><text x="26" y="1072" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1f2933" text-anchor="start">no Reader role (403) · subscription not found (404) · sign-in failed (bad secret / tenant).</text><text x="26" y="1104" font-family="Liberation Mono, monospace" font-size="14.5" font-weight="700" fill="#7d261c" text-anchor="start">The same check is available offline:  python -m app.manage check-azure</text></svg>