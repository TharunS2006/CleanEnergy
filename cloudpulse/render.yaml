services:
  - type: web
    name: cloudpulse
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WORKSPACE_NAME
        value: My Azure subscription
      # Azure: use a service principal (the CLI-login option can't work on a server)
      - key: AZURE_SUBSCRIPTION_ID
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      # AWS (optional)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: ap-south-1
      - key: DEMO_ENABLED
        value: "true"
      - key: COLLECT_INTERVAL_MINUTES
        value: "360"
      # The free plan has no persistent disk, so this SQLite file resets on each
      # deploy or restart. The app reads the accounts again at startup, so the
      # page refills itself. Point this at a Postgres URL to keep history.
      - key: DATABASE_URL
        value: sqlite:////app/db/cloudpulse.db
