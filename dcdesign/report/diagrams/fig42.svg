</defs><text x="450" y="30" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="middle">The resilient reference design</text><rect x="30" y="56" width="120" height="60" rx="10" fill="#eef0f2" stroke="#3e4850" stroke-width="1.8" opacity="1"/><text x="90" y="92" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Internet</text><rect x="200" y="56" width="330" height="60" rx="10" fill="#fbe9e6" stroke="#7d261c" stroke-width="1.8" opacity="1"/><text x="365" y="80" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="middle">Firewall pair FW1 + FW2</text><text x="365" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">default deny, only the intended flows</text><path d="M150,86 L200,86" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="580" y="56" width="290" height="60" rx="10" fill="#fbe9e6" stroke="#7d261c" stroke-width="1.8" opacity="1"/><text x="725" y="80" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="middle">Management zone (mgmt)</text><text x="725" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">no route from the internet</text><rect x="30" y="150" width="520" height="150" rx="12" fill="#eceefa" stroke="#33366b" stroke-width="2" stroke-dasharray="7 5" opacity="1"/><rect x="46" y="135" width="268.6" height="30" rx="6" fill="#33366b" stroke="#33366b" stroke-width="1.5" opacity="1"/><text x="59" y="156" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">NETWORK ZONES (virtual)</text><rect x="60" y="190" width="120" height="80" rx="8" fill="#fff" stroke="#33366b" stroke-width="1.8" opacity="1"/><text x="120" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">dmz: web VMs</text><text x="120" y="244" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">port 443</text><rect x="240" y="190" width="120" height="80" rx="8" fill="#fff" stroke="#33366b" stroke-width="1.8" opacity="1"/><text x="300" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">app: app VMs</text><text x="300" y="244" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">port 8443</text><rect x="420" y="190" width="120" height="80" rx="8" fill="#fff" stroke="#33366b" stroke-width="1.8" opacity="1"/><text x="480" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">db: databases</text><text x="480" y="244" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">port 5432</text><path d="M180,230 L240,230" fill="none" stroke="#14564c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrG)"/><path d="M360,230 L420,230" fill="none" stroke="#14564c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrG)"/><path d="M365,116 L365,174 L120,174 L120,190" fill="none" stroke="#14564c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrG)"/><rect x="580" y="150" width="290" height="150" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" opacity="1"/><text x="596" y="176" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">Intended flows only:</text><text x="596" y="196" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">internet → dmz : 443</text><text x="596" y="216" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">dmz → app : 8443</text><text x="596" y="236" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">app → db : 5432</text><text x="596" y="256" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">mgmt → dmz, app, db : 22</text><rect x="30" y="330" width="840" height="250" rx="12" fill="#e6f1fb" stroke="#0b4f8a" stroke-width="2" stroke-dasharray="7 5" opacity="1"/><rect x="46" y="315" width="391.0" height="30" rx="6" fill="#0b4f8a" stroke="#0b4f8a" stroke-width="1.5" opacity="1"/><text x="59" y="336" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">PHYSICAL LAYER (every path doubled)</text><rect x="60" y="366" width="170" height="150" rx="10" fill="#fff" stroke="#0b4f8a" stroke-width="1.8" opacity="1"/><text x="145" y="390" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b4f8a" text-anchor="middle">Rack R1</text><rect x="74" y="404" width="70" height="30" rx="6" fill="#eceefa" stroke="#33366b" stroke-width="1.4" opacity="1"/><text x="109" y="424" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">host</text><rect x="152" y="404" width="70" height="30" rx="6" fill="#eceefa" stroke="#33366b" stroke-width="1.4" opacity="1"/><text x="187" y="424" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">host</text><rect x="74" y="442" width="70" height="30" rx="6" fill="#eceefa" stroke="#33366b" stroke-width="1.4" opacity="1"/><text x="109" y="462" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">host</text><rect x="250" y="366" width="170" height="150" rx="10" fill="#fff" stroke="#0b4f8a" stroke-width="1.8" opacity="1"/><text x="335" y="390" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b4f8a" text-anchor="middle">Rack R2</text><rect x="264" y="404" width="70" height="30" rx="6" fill="#eceefa" stroke="#33366b" stroke-width="1.4" opacity="1"/><text x="299" y="424" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">host</text><rect x="342" y="404" width="70" height="30" rx="6" fill="#eceefa" stroke="#33366b" stroke-width="1.4" opacity="1"/><text x="377" y="424" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">host</text><rect x="264" y="442" width="70" height="30" rx="6" fill="#eceefa" stroke="#33366b" stroke-width="1.4" opacity="1"/><text x="299" y="462" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">host</text><rect x="342" y="442" width="70" height="30" rx="6" fill="#eceefa" stroke="#33366b" stroke-width="1.4" opacity="1"/><text x="377" y="462" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">host</text><rect x="470" y="366" width="380" height="66" rx="8" fill="#fbf3df" stroke="#5a4314" stroke-width="1.8" opacity="1"/><text x="660" y="392" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">Power: feed A + feed B (each host has both)</text><text x="660" y="414" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">Cooling: unit C1 + unit C2</text><rect x="470" y="442" width="380" height="66" rx="8" fill="#fbf3df" stroke="#5a4314" stroke-width="1.8" opacity="1"/><text x="660" y="468" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">Network: switch SW1 + SW2 per host</text><text x="660" y="490" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">Storage: arrays SAN1 + SAN2, mirrored</text><text x="450" y="548" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">Seven hosts for 40 VMs: the loss of any one host, or of a whole rack, leaves every service running</text></svg>